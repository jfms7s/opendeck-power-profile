[package]
name = "opendeck-power-profile"
version = "0.3.0"
edition = "2024"
# Minimum supported Rust: the highest `rust-version` in the dependency tree
# (uuid, via zbus). CI checks it in the `msrv` job.
rust-version = "1.89"
license = "MIT"
description = "OpenDeck plugin: step through power profiles (power-profiles-daemon or tuned-ppd) with a Stream Deck dial"
repository = "https://github.com/jfms7s/opendeck-power-profile"

[dependencies]
tokio = { version = "1.48", features = ["rt", "macros", "time"] }
zbus = { version = "5", default-features = false, features = ["tokio"] }
futures-util = "0.3"
thiserror = "2"
serde_json = "1.0"
openaction = "2.7"
async-trait = "0.1"
log = "0.4"
serde = { version = "1.0", features = ["derive"] }
simplelog = "0.12"
# zbus logs through `tracing`; its `log` feature forwards those events to
# the `log` logger above, so zbus warnings reach the plugin log.
tracing = { version = "0.1", default-features = false, features = ["log"] }

[dev-dependencies]
roxmltree = "0.21"
tokio = { version = "1.48", features = ["sync"] }

[profile.release]
lto = true
codegen-units = 1
strip = true
