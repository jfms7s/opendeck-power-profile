[package]
name = "opendeck-power-profile"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "OpenDeck plugin: step through power-profiles-daemon profiles with a Stream Deck dial"
repository = "https://github.com/jfms7s/opendeck-power-profile"

[dependencies]
tokio = { version = "1.48", features = ["rt-multi-thread", "macros", "time"] }
zbus = { version = "4", default-features = false, features = ["tokio"] }
futures-util = "0.3"
thiserror = "2"
