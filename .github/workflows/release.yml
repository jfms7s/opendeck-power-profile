name: Release
# Push a tag `v<version>` matching Cargo.toml and assets/manifest.json. This
# re-runs the checks and the advisory scan, builds the x86_64 Linux binary, packages the bundle with a
# SHA256SUMS file, and creates a *draft* release with both attached - so no
# release is ever visible without its asset. The draft's notes start with the
# README's smoke-test checklist, unticked (scripts/release-body.mjs). Run that
# checklist on a device, record it in the notes, then publish the draft;
# Ansible only installs the latest published release.
# Publishing freezes it: immutable releases are on for this repository, so a
# published release's assets and tag can't be replaced - fix a bad release
# with a new version.
on:
  push:
    tags: ["v*"]

permissions: {}

env:
  # Same toolchain as ci.yml.
  RUST_TOOLCHAIN: "1.98.1"

jobs:
  verify:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1 (2026-10-01)
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          components: rustfmt, clippy
      - name: Install dbus-daemon (the D-Bus tests run a private bus)
        run: command -v dbus-daemon || { sudo apt-get update && sudo apt-get install -y dbus-daemon; }
      - run: cargo fmt --check
      - run: cargo clippy --all-targets --locked -- -D warnings
      - run: cargo test --locked

  # A tag can't produce a release past a known RustSec advisory (same check as
  # advisories.yml; exceptions live in deny.toml).
  advisories:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          command: check
          command-arguments: advisories

  # Builds with a read-only token: no dependency build script ever runs next
  # to a token that can write to the repository.
  build:
    needs: [verify, advisories]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1 (2026-10-01)
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          targets: x86_64-unknown-linux-gnu
      - run: cargo build --release --locked --target x86_64-unknown-linux-gnu
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: Package (fails unless the tag is v<Cargo/manifest version>)
        run: node build.mjs --release --tag "$GITHUB_REF_NAME" x86_64-unknown-linux-gnu
      # Written after build.mjs has zipped the bundle and written SHA256SUMS,
      # so it is in neither; it only becomes the draft's notes.
      - name: Write the draft's notes (the README smoke checklist, unticked)
        run: node scripts/release-body.mjs > dist/RELEASE_BODY.md
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: plugin
          path: |
            dist/*.streamDeckPlugin
            dist/SHA256SUMS
            dist/RELEASE_BODY.md
          if-no-files-found: error

  # The only job with a write token, and it runs no project code.
  publish:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: plugin
          path: dist
      - name: Check the bundle against its checksum
        working-directory: dist
        run: sha256sum --check SHA256SUMS
      - uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          draft: true
          # GitHub puts the generated change list after this body.
          body_path: dist/RELEASE_BODY.md
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            dist/*.streamDeckPlugin
            dist/SHA256SUMS
