name: Release
# Push a tag `v<version>` matching Cargo.toml and assets/manifest.json. This
# re-runs the checks, builds both architectures, packages the bundle with a
# SHA256SUMS file, and creates a *draft* release with both attached - so no
# release is ever visible without its asset. Run the README smoke test, then
# publish the draft; Ansible only installs the latest published release.
on:
  push:
    tags: ["v*"]

permissions: {}

env:
  # Same toolchain as ci.yml.
  RUST_TOOLCHAIN: "1.98.1"

jobs:
  verify:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # v1 (2026-10-01)
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          components: rustfmt, clippy
      - name: Install dbus-daemon (the D-Bus tests run a private bus)
        run: command -v dbus-daemon || { sudo apt-get update && sudo apt-get install -y dbus-daemon; }
      - run: cargo fmt --check
      - run: cargo clippy --all-targets --locked -- -D warnings
      - run: cargo test --locked

  # Builds with a read-only token: no dependency build script ever runs next
  # to a token that can write to the repository.
  build:
    needs: verify
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # v1 (2026-10-01)
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          targets: x86_64-unknown-linux-gnu,aarch64-unknown-linux-gnu
      - name: Install cross-compilation linker (aarch64)
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu
          echo "CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=aarch64-linux-gnu-gcc" >> "$GITHUB_ENV"
      - run: cargo build --release --locked --target x86_64-unknown-linux-gnu
      - run: cargo build --release --locked --target aarch64-unknown-linux-gnu
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - name: Package (fails unless the tag is v<Cargo/manifest version>)
        run: node build.mjs --release --tag "$GITHUB_REF_NAME" x86_64-unknown-linux-gnu aarch64-unknown-linux-gnu
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: plugin
          path: |
            dist/*.streamDeckPlugin
            dist/SHA256SUMS
          if-no-files-found: error

  # The only job with a write token, and it runs no project code.
  publish:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: plugin
          path: dist
      - name: Check the bundle against its checksum
        working-directory: dist
        run: sha256sum --check SHA256SUMS
      - uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          draft: true
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            dist/*.streamDeckPlugin
            dist/SHA256SUMS
