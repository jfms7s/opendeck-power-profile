name: Release
# Replaces the in-repo release jobs verify, advisories, build, publish.
on:
  push:
    tags: ["v*"]

permissions: {}

jobs:
  release:
    # The called workflow's own jobs ask for exactly what they need; only its
    # `publish` job gets the write permissions.
    permissions:
      contents: write
      id-token: write
      attestations: write
    uses: jfms7s/opendeck-plugin-ci/.github/workflows/release.yml@098bfd0f9d891c2db4f26cd95627e6e6a567563a # v0.1.0
    with:
      apt-packages: "dbus-daemon"
      audit: "cargo-deny"
      macos: false
      release-notes: true
